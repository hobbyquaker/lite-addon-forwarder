# etc/lighttpd.conf of lite-addon-forwarder (MIT): openccu-lite proxies /addons/forwarder/ to the
# daemon on the loopback and serves the 503 page while it is not running.
$HTTP["url"] == "/addons/forwarder" {
    url.redirect = ("" => "/addons/forwarder/")
}
$HTTP["url"] =~ "^/addons/forwarder/" {
    proxy.server = ("/addons/forwarder/" => (("host" => "127.0.0.1", "port" => 8295)))
    server.errorfile-prefix = "/usr/local/addons/forwarder/www/lighttpd-error-"
}
